<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Athlete Criterion"/>
  <title>The Athlete Criterion</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:    #1c1c1e;
      --bg2:   #252528;
      --bg3:   #2e2e32;
      --bg4:   #3a3a3e;
      --border:#3a3a3e;
      --text:  #f2f2f5;
      --text2: #b0aaa0;
      --text3: #888888;
      --text4: #555558;
      --gold:  #c8a84b;
      --gold2: #e2c96a;
      --gold3: rgba(200,168,75,0.15);
      --green: #22c55e;
      --yellow:#f59e0b;
      --red:   #ef4444;
      --blue:  #3b82f6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;font-size:13px}

    /* ── LOGIN ── */
    #login-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
    #login-screen.hidden{display:none}
    .login-card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:40px 32px;box-shadow:0 24px 60px rgba(0,0,0,0.5)}
    .login-logo{display:flex;justify-content:center;margin-bottom:18px}
    .login-logo svg{opacity:0.9}
    .login-appname{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:0.16em;text-align:center;margin-bottom:4px}
    .login-tagline{font-size:9px;color:var(--text4);letter-spacing:0.1em;text-align:center;margin-bottom:28px;text-transform:uppercase}
    .login-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:24px;gap:3px}
    .login-tab{flex:1;background:none;border:none;border-radius:6px;padding:9px 0;font-size:10px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.05em;color:var(--text4);transition:all 0.15s}
    .login-tab.active{background:var(--gold);color:#0a0a0a}
    .login-form{display:none}.login-form.active{display:block}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px}
    .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 12px;font-size:13px;font-family:'DM Mono',monospace;outline:none;transition:border-color 0.15s}
    .field input:focus{border-color:var(--gold)}
    .login-btn{width:100%;background:var(--gold);color:#0a0a0a;border:none;border-radius:7px;padding:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.06em;margin-top:6px;transition:opacity 0.15s}
    .login-btn:hover{opacity:0.85}
    .login-btn:disabled{opacity:0.5;cursor:not-allowed}
    .login-error{font-size:11px;color:var(--red);margin-top:10px;display:none;line-height:1.4}
    .login-success{font-size:11px;color:var(--green);margin-top:10px;display:none;line-height:1.4}
    .login-footer{margin-top:22px;font-size:10px;color:var(--text4);text-align:center;letter-spacing:0.05em}

    /* ── APP ── */
    #app{display:none}
    #app.visible{display:block}

    /* ── NAV ── */
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .nav-logo{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:0.12em}
    .nav-center{display:flex;gap:3px}
    .nav-tab{background:none;border:none;color:var(--text4);font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.06em;padding:7px 12px;cursor:pointer;border-radius:5px;transition:all 0.15s}
    .nav-tab:hover{color:var(--text)}
    .nav-tab.active{background:var(--gold);color:#0a0a0a}
    .nav-right{display:flex;align-items:center;gap:10px}
    .nav-user{font-size:9px;color:var(--text4);letter-spacing:0.05em}
    .signout-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--text4);font-size:9px;padding:4px 9px;cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s}
    .signout-btn:hover{color:var(--red);border-color:var(--red)}

    /* ── PAGES ── */
    .page{display:none;padding:18px 16px 80px;max-width:500px;margin:0 auto}
    .page.active{display:block}

    /* ── SECTION HEADER ── */
    .sh{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:0.14em;font-weight:700;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}

    /* ── CLIENT CARDS ── */
    .client-card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color 0.15s}
    .client-card:hover{border-color:var(--gold)}
    .client-name{font-weight:700;font-size:14px;color:var(--text);margin-bottom:2px}
    .client-meta{font-size:10px;color:var(--text3)}
    .client-badge{display:inline-block;background:var(--bg3);color:var(--gold);border-radius:3px;padding:2px 7px;font-size:9px;font-weight:600}
    .badge{display:inline-block;border-radius:3px;padding:2px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
    .badge-green{background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.3)}
    .badge-yellow{background:rgba(245,158,11,0.15);color:var(--yellow);border:1px solid rgba(245,158,11,0.3)}
    .badge-red{background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
    .badge-blue{background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.3)}
    .badge-gold{background:rgba(200,168,75,0.15);color:var(--gold);border:1px solid rgba(200,168,75,0.3)}

    /* ── GROUP FILTER ── */
    .group-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .group-btn{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--gold);font-size:10px;padding:5px 11px;cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s}
    .group-btn.active{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}

    /* ── FAB ── */
    #fab{position:fixed;bottom:22px;right:22px;background:var(--gold);color:#0a0a0a;border:none;border-radius:50%;width:50px;height:50px;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(200,168,75,0.4);z-index:20;display:none;align-items:center;justify-content:center}
    #fab.visible{display:flex}

    /* ── FORM ── */
    .form-card{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:16px;margin-bottom:10px}
    select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 12px;font-size:13px;font-family:'DM Mono',monospace;outline:none}
    select:focus{border-color:var(--gold)}
    textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px 12px;font-size:13px;font-family:'DM Mono',monospace;outline:none;resize:vertical;min-height:60px}
    .btn-primary{width:100%;background:var(--gold);color:#0a0a0a;border:none;border-radius:7px;padding:12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.06em;margin-top:4px}
    .btn-secondary{background:var(--bg3);color:var(--gold);border:1px solid var(--border);border-radius:6px;padding:9px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Mono',monospace}
    .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}

    /* ── METRIC ROWS ── */
    .metric-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg3)}
    .metric-label{font-size:11px;color:var(--text3)}
    .metric-value{font-size:13px;font-weight:600;color:var(--text)}
    .metric-unit{font-size:10px;color:var(--text4);margin-left:2px}

    /* ── SESSION ENTRY ── */
    .section-note{font-size:9px;color:var(--text4);margin-top:3px;margin-bottom:10px}
    .auto-tag{font-size:8px;color:var(--gold);background:rgba(200,168,75,0.1);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}

    /* ── RADAR ── */
    .radar-wrap{display:flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
    .radar-domain-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg)}
    .radar-domain-name{font-size:11px;color:var(--text3)}
    .radar-bar-wrap{width:70px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:0 8px}
    .radar-bar-fill{height:100%;border-radius:3px}
    .radar-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right}

    /* ── REPORT CARDS ── */
    .report-card{background:var(--bg);border-radius:7px;padding:11px 13px;margin-bottom:7px}
    .report-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
    .report-metric{font-weight:700;font-size:12px;color:var(--text)}
    .report-value{border-radius:3px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:8px;white-space:nowrap}
    .report-finding{font-size:11px;color:var(--text3);margin-bottom:6px;line-height:1.5}
    .report-rec{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:5px}
    .report-target{font-size:10px;font-weight:600;margin-bottom:4px}
    .report-ref{font-size:9px;color:var(--text4)}

    /* ── TABS ── */
    .tab-bar{display:flex;gap:6px;margin-bottom:14px}
    .tab-btn{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text4);font-size:10px;font-weight:600;padding:7px 12px;cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s}
    .tab-btn.active{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}

    /* ── TREND ── */
    .trend-row{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 13px;margin-bottom:7px}
    .trend-label{font-size:11px;color:var(--text3)}
    .trend-pct{font-size:13px;font-weight:700}
    .trend-detail{font-size:10px;color:var(--text4);margin-top:3px}

    /* ── RANK ── */
    .rank-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bg)}
    .rank-metric{font-size:11px;color:var(--text3)}
    .rank-val{font-size:11px;color:var(--text2)}
    .rank-badge{font-size:11px;font-weight:700}

    /* ── HERO ── */
    .hero-card{background:linear-gradient(135deg,#1c1810,#1c1c1e);border:1px solid #2a2520;border-radius:10px;padding:16px;margin-bottom:14px}
    .hero-name{font-size:20px;font-weight:700;color:var(--text)}
    .hero-sub{color:var(--gold2);font-size:12px;margin-top:3px}
    .hero-meta{color:var(--text4);font-size:11px;margin-top:2px}
    .hero-avg{display:flex;align-items:center;gap:8px;margin-top:10px}
    .hero-avg-label{font-size:11px;color:var(--text4)}
    .hero-avg-val{font-size:17px;font-weight:700}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:7px;padding:12px 20px;font-size:11px;letter-spacing:0.05em;z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    #toast.error{border-left-color:var(--red)}

    /* ── EMPTY ── */
    .empty{text-align:center;padding:50px 20px;color:var(--text4);font-size:12px;line-height:2}

    /* ── BATTERY ── */
    .battery-toggle{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--gold);font-size:11px;padding:9px 13px;cursor:pointer;font-family:'DM Mono',monospace;margin-top:14px}
    .battery-content{display:none;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:13px;margin-top:4px}
    .battery-content.open{display:block}
    .battery-cat{margin-bottom:8px}
    .battery-cat-name{font-size:10px;color:var(--text3);font-weight:700;margin-bottom:3px}
    .battery-tests{display:flex;flex-wrap:wrap;gap:3px}
    .battery-test{background:var(--bg2);color:var(--gold2);border-radius:3px;padding:2px 6px;font-size:9px}

    /* ── SUBSECTION ── */
    .subsection{font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:0.08em;margin:12px 0 5px}

    /* ── FMS BILATERAL ── */
    .fms-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bg3)}
    .fms-label{font-size:11px;color:var(--text3)}
    .fms-scores{display:flex;align-items:center;gap:8px}
    .fms-score{font-size:12px;font-weight:700}

    /* ── REFERENCES ── */
    .ref-list{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:12px;margin-top:14px}
    .ref-item{font-size:9px;color:var(--text4);margin-bottom:3px;line-height:1.5}
    .ref-title{font-size:9px;color:var(--text4);font-weight:700;margin-bottom:6px;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" stroke="#c8a84b" stroke-width="1.5" fill="none"/>
        <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" stroke="#c8a84b" stroke-width="0.8" fill="rgba(200,168,75,0.07)"/>
        <circle cx="18" cy="18" r="3" fill="#c8a84b"/>
      </svg>
    </div>
    <div class="login-appname">THE ATHLETE CRITERION</div>
    <div class="login-tagline">Performance Assessment Platform</div>

    <div class="login-tabs">
      <button class="login-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
      <button class="login-tab" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div class="login-form active" id="form-signin">
      <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div class="field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="login-btn" id="btn-signin" onclick="doLogin()">Sign In</button>
      <div class="login-error" id="l-err"></div>
      <div style="text-align:center;margin-top:12px"><button onclick="switchTab('reset')" style="background:none;border:none;color:var(--text4);font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;text-decoration:underline">Forgot password?</button></div>
    </div>

    <div class="login-form" id="form-signup">
      <div class="field"><label>Full Name</label><input type="text" id="r-name" placeholder="Your name" onkeydown="if(event.key==='Enter')doSignup()"/></div>
      <div class="field"><label>Email</label><input type="email" id="r-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doSignup()"/></div>
      <div class="field"><label>Password</label><input type="password" id="r-pass" placeholder="Min. 8 characters" onkeydown="if(event.key==='Enter')doSignup()"/></div>
      <button class="login-btn" id="btn-signup" onclick="doSignup()">Create Account</button>
      <div class="login-error" id="r-err"></div>
      <div class="login-success" id="r-ok"></div>
    </div>

    <div class="login-form" id="form-reset">
      <div class="field"><label>Email</label><input type="email" id="reset-email" placeholder="your@email.com"/></div>
      <button class="login-btn" onclick="doReset()">Send Reset Link</button>
      <div class="login-success" id="reset-ok"></div>
      <div style="text-align:center;margin-top:12px"><button onclick="switchTab('signin')" style="background:none;border:none;color:var(--text4);font-size:10px;cursor:pointer;font-family:'DM Mono',monospace;text-decoration:underline">Back to sign in</button></div>
    </div>

    <div class="login-footer">Athlete data is private to each account.</div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <nav>
    <div class="nav-logo">THE ATHLETE CRITERION</div>
    <div class="nav-center">
      <button class="nav-tab active" onclick="showPage('clients',this)">Clients</button>
      <button class="nav-tab" onclick="showPage('report-page',this)">Report</button>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="nav-user"></span>
      <button class="signout-btn" onclick="doSignout()">Sign Out</button>
    </div>
  </nav>

  <!-- CLIENTS PAGE -->
  <div class="page active" id="page-clients">
    <div id="group-filter-wrap" class="group-filters" style="display:none"></div>
    <div id="clients-list"><div class="empty">No clients yet.<br>Tap + to add your first athlete.</div></div>
  </div>

  <!-- ADD/EDIT CLIENT PAGE -->
  <div class="page" id="page-add-client">
    <div class="sh">Client Info</div>
    <div class="form-card">
      <div class="field"><label>Full Name</label><input type="text" id="c-name" placeholder="Athlete name"/></div>
      <div class="field"><label>Age</label><input type="number" id="c-age" placeholder="Age"/></div>
      <div class="field"><label>Position (optional)</label><input type="text" id="c-position" placeholder="Position"/></div>
      <div class="field"><label>Team / Group (optional)</label><input type="text" id="c-group" placeholder="e.g. Towson WBB"/></div>
      <div class="field"><label>Sex</label><select id="c-sex"><option>Male</option><option>Female</option></select></div>
      <div class="field"><label>Sport</label><select id="c-sport" onchange="updateBatteryPreview()">
        <option>Basketball</option><option>Soccer</option><option>Football</option><option>Volleyball</option>
        <option>Baseball/Softball</option><option>Track & Field</option><option>Swimming</option>
        <option>Tennis</option><option>Lacrosse</option><option>Wrestling</option><option>General Athletic</option>
      </select></div>
      <div class="field"><label>Competitive Level</label><select id="c-level">
        <option>Youth (< 14)</option><option>High School</option><option>NCAA DIII</option>
        <option>NCAA DII</option><option>NCAA DI</option><option>Professional</option><option>Recreational</option>
      </select></div>
      <div class="field"><label>Notes (optional)</label><textarea id="c-notes" placeholder="Injury history, goals..."></textarea></div>
    </div>
    <div id="battery-preview-wrap">
      <button class="battery-toggle" onclick="toggleBattery('add')">Recommended Battery ▼</button>
      <div class="battery-content" id="battery-add"></div>
    </div>
    <div style="margin-top:16px">
      <button class="btn-primary" onclick="saveClient()">SAVE CLIENT</button>
    </div>
  </div>

  <!-- CLIENT PROFILE PAGE -->
  <div class="page" id="page-profile">
    <div id="profile-hero"></div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchProfileTab('overview',this)">Overview</button>
      <button class="tab-btn" onclick="switchProfileTab('radar',this)">Radar</button>
      <button class="tab-btn" onclick="switchProfileTab('trends',this)">Trends</button>
    </div>
    <div class="btn-grid">
      <button class="btn-secondary" onclick="showPage('test-entry',null)">+ New Session</button>
      <button class="btn-secondary" onclick="openReport()">View Report</button>
    </div>
    <div id="profile-overview"></div>
    <div id="profile-radar" style="display:none"></div>
    <div id="profile-trends" style="display:none"></div>
    <div id="battery-profile-wrap" style="margin-top:14px"></div>
    <div id="session-history"></div>
  </div>

  <!-- TEST ENTRY PAGE -->
  <div class="page" id="page-test-entry">
    <div id="session-header" style="background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:9px 13px;margin-bottom:14px;font-size:11px;color:var(--text4)"></div>
    <div id="test-fields"></div>
    <div style="margin-top:20px"><button class="btn-primary" onclick="saveSession()">SAVE SESSION</button></div>
  </div>

  <!-- REPORT PAGE -->
  <div class="page" id="page-report-page">
    <div class="empty" id="report-empty">Select a client and tap View Report to generate a performance report.</div>
    <div id="report-content" style="display:none"></div>
  </div>
</div>

<button id="fab" onclick="showPage('add-client',null)">+</button>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════

async function loadClients() {
  if (!currentUser) return;
  try {
    const { data, error } = await sb.from('clients').select('data').eq('user_id', currentUser.id).single();
    if (error || !data) { clients = []; return; }
    clients = data.data || [];
  } catch { clients = []; }
}

async function persistClients() {
  if (!currentUser) return;
  try {
    await sb.from('clients').upsert(
      { user_id: currentUser.id, data: clients, updated_at: new Date().toISOString() },
      { onConflict: 'user_id' }
    );
  } catch(e) { console.error('Save error:', e); }
}

// ═══════════════════════════════════════════════════════════════════════════
function switchTab(tab) {
  ['signin','signup','reset'].forEach(t => {
    document.getElementById('tab-'+t) && document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('form-'+t).classList.toggle('active', t===tab);
  });
  ['l-err','r-err','r-ok','reset-ok'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (!email || !pass) { showAuthErr('l-err', 'Please enter email and password.'); return; }
  setBtnLoading('btn-signin', true, 'Signing in...');
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  setBtnLoading('btn-signin', false, 'Sign In');
  if (error) { showAuthErr('l-err', error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : error.message); return; }
  loginSuccess(data.user);
}

async function doSignup() {
  const name = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass = document.getElementById('r-pass').value;
  if (!name) { showAuthErr('r-err', 'Please enter your name.'); return; }
  if (!email || !email.includes('@')) { showAuthErr('r-err', 'Please enter a valid email.'); return; }
  if (pass.length < 8) { showAuthErr('r-err', 'Password must be at least 8 characters.'); return; }
  setBtnLoading('btn-signup', true, 'Creating...');
  const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
  setBtnLoading('btn-signup', false, 'Create Account');
  if (error) { showAuthErr('r-err', error.message); return; }
  const ok = document.getElementById('r-ok');
  ok.textContent = 'Account created! Check your email to confirm, then sign in.';
  ok.style.display = 'block';
  setTimeout(() => switchTab('signin'), 3000);
}

async function doReset() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) return;
  await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  const ok = document.getElementById('reset-ok');
  ok.textContent = 'Reset link sent. Check your email.';
  ok.style.display = 'block';
}

async function doSignout() {
  await sb.auth.signOut();
  currentUser = null; clients = []; activeClient = null;
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('visible');
  document.getElementById('fab').classList.remove('visible');
  document.getElementById('l-email').value = '';
  document.getElementById('l-pass').value = '';
}

function loginSuccess(user) {
  currentUser = user;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  document.getElementById('fab').classList.add('visible');
  const name = user.user_metadata?.full_name || user.email.split('@')[0];
  document.getElementById('nav-user').textContent = name.toUpperCase();
  init();
}

function showAuthErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}

function setBtnLoading(id, loading, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text; el.disabled = loading;
}

// ═══════════════════════════════════════════════════════════════════════════
// AUTO-CALCULATIONS
// ═══════════════════════════════════════════════════════════════════════════
function autoCalc(raw) {
  const d = Object.assign({}, raw);
  const n = v => parseFloat(v);

  // EUR
  if (d.cmj_height && d.squat_jump && !isNaN(n(d.cmj_height)) && !isNaN(n(d.squat_jump)) && n(d.squat_jump) > 0)
    d.eur = (n(d.cmj_height) / n(d.squat_jump)).toFixed(3);

  // Bilateral asymmetry from SL-CMJ
  if (d.sl_cmj_l && d.sl_cmj_r && !isNaN(n(d.sl_cmj_l)) && !isNaN(n(d.sl_cmj_r))) {
    const mx = Math.max(n(d.sl_cmj_l), n(d.sl_cmj_r));
    if (mx > 0) d.bilateral_asym = (Math.abs(n(d.sl_cmj_l) - n(d.sl_cmj_r)) / mx * 100).toFixed(1);
  }

  // NordBord LSI and asymmetry
  if (d.nord_l_peak && d.nord_r_peak && !isNaN(n(d.nord_l_peak)) && !isNaN(n(d.nord_r_peak))) {
    const mx = Math.max(n(d.nord_l_peak), n(d.nord_r_peak));
    const mn = Math.min(n(d.nord_l_peak), n(d.nord_r_peak));
    if (mx > 0) {
      d.lsi_nord = (mn / mx * 100).toFixed(1);
      d.nord_asym = (Math.abs(n(d.nord_l_peak) - n(d.nord_r_peak)) / mx * 100).toFixed(1);
    }
  }

  // Isometric quad LSI
  if (d.iso_quad_l && d.iso_quad_r && !isNaN(n(d.iso_quad_l)) && !isNaN(n(d.iso_quad_r))) {
    const mx = Math.max(n(d.iso_quad_l), n(d.iso_quad_r));
    if (mx > 0) d.lsi_quad = (Math.min(n(d.iso_quad_l), n(d.iso_quad_r)) / mx * 100).toFixed(1);
  }

  // BESS total
  const bessKeys = ["bess_double_firm","bess_single_firm","bess_tandem_firm","bess_double_foam","bess_single_foam","bess_tandem_foam"];
  const bessVals = bessKeys.map(k => n(d[k])).filter(v => !isNaN(v));
  if (bessVals.length === 6) d.bess_total = bessVals.reduce((a,b) => a+b, 0);

  // 300-yard shuttle fatigue
  if (d.shuttle_300yd && d.shuttle_300yd_rest && !isNaN(n(d.shuttle_300yd)) && !isNaN(n(d.shuttle_300yd_rest)))
    d.shuttle_fatigue = (n(d.shuttle_300yd_rest) - n(d.shuttle_300yd)).toFixed(1);

  // RSA fatigue index
  if (d.rsa_best && d.rsa_mean && !isNaN(n(d.rsa_best)) && !isNaN(n(d.rsa_mean)) && !d.rsa_fatigue_idx)
    d.rsa_fatigue_idx = (((n(d.rsa_mean) - n(d.rsa_best)) / n(d.rsa_best)) * 100).toFixed(1);

  // FMS composite
  const fmsMap = [["fms_deep_squat"],["fms_hurdle_l","fms_hurdle_r"],["fms_lunge_l","fms_lunge_r"],
    ["fms_shoulder_l","fms_shoulder_r"],["fms_aslr_l","fms_aslr_r"],["fms_tspu"],["fms_rs_l","fms_rs_r"]];
  let fmsTotal = 0, fmsComplete = true;
  fmsMap.forEach(keys => {
    const vals = keys.map(k => n(d[k])).filter(v => !isNaN(v));
    if (vals.length === 0) { fmsComplete = false; return; }
    fmsTotal += Math.min(...vals);
  });
  if (fmsComplete) d.fms_total = fmsTotal;

  return d;
}

// BENCHMARKS
// ═══════════════════════════════════════════════════════════════════════════
const LOWER_IS_BETTER = new Set(["pro_agility","sprint_10m","sprint_20m","sprint_40yd","lane_agility"]);

function getBenchmark(metric, sex, level) {
  const M="Male",F="Female",HS="High School",D3="NCAA DIII",D2="NCAA DII",D1="NCAA DI",PRO="Professional";
  const T = {
    squat_1rm:  {[M]:{[HS]:305,[D3]:385,[D2]:395,[D1]:405,[PRO]:420},[F]:{[HS]:135,[D3]:135,[D2]:135,[D1]:135,[PRO]:145}},
    bench_1rm:  {[M]:{[HS]:185,[D3]:295,[D2]:305,[D1]:315,[PRO]:330},[F]:{[HS]:112,[D3]:112,[D2]:112,[D1]:112,[PRO]:120}},
    clean_1rm:  {[M]:{[HS]:183,[D3]:220,[D2]:240,[D1]:261,[PRO]:270},[F]:{[HS]:112,[D3]:112,[D2]:112,[D1]:112,[PRO]:115}},
    broad_jump_fp:{[M]:{[HS]:100,[D3]:108,[D2]:109,[D1]:110,[PRO]:112},[F]:{[HS]:90,[D3]:95,[D2]:96,[D1]:98,[PRO]:100}},
    pro_agility:{[M]:{[HS]:4.50,[D3]:4.45,[D2]:4.42,[D1]:4.39,[PRO]:4.30},[F]:{[HS]:5.10,[D3]:5.00,[D2]:4.97,[D1]:4.94,[PRO]:4.85}},
    vertical:   {[M]:{[HS]:26,[D3]:28,[D2]:29,[D1]:30,[PRO]:32},[F]:{[HS]:18,[D3]:19,[D2]:20,[D1]:21,[PRO]:23}},
    cmj_height: {[M]:{[HS]:22,[D3]:24,[D2]:25,[D1]:26,[PRO]:28},[F]:{[HS]:16,[D3]:17,[D2]:18,[D1]:19,[PRO]:21}},
  };
  return T[metric]?.[sex]?.[level] ?? null;
}

function pctOfBenchmark(value, metric, sex, level) {
  const bench = getBenchmark(metric, sex, level);
  if (!bench || isNaN(parseFloat(value))) return null;
  const v = parseFloat(value);
  return Math.min(Math.round(LOWER_IS_BETTER.has(metric) ? (bench/v)*100 : (v/bench)*100), 150);
}

// RADAR SCORES
// ═══════════════════════════════════════════════════════════════════════════
function getRadarScores(data, sex, level) {
  const n = v => parseFloat(v);
  const avg = arr => { const v=arr.filter(x=>x!==null&&!isNaN(x)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; };

  const rsi = n(data.rsi_mod);
  let reactiveStr = null;
  if (!isNaN(rsi)) reactiveStr = Math.min(Math.round((rsi/2.0)*100),150);

  const vo2 = n(data.vo2max);
  let aerobic = null;
  if (!isNaN(vo2)) { const bench=sex==="Male"?45.6:39.5; aerobic=Math.min(Math.round((vo2/bench)*100),150); }

  const movScores = [];
  ["fms_deep_squat","fms_hurdle_l","fms_hurdle_r","fms_lunge_l","fms_lunge_r",
   "fms_shoulder_l","fms_shoulder_r","fms_aslr_l","fms_aslr_r","fms_tspu","fms_rs_l","fms_rs_r"
  ].forEach(k => { const v=n(data[k]); if(!isNaN(v)) movScores.push((v/3)*100); });
  if (!movScores.length) { const fms=n(data.fms_total); if(!isNaN(fms)) movScores.push(Math.min((fms/21)*100*1.33,100)); }
  [n(data.sl_squat_l),n(data.sl_squat_r)].forEach(v => { if(!isNaN(v)) movScores.push((v/3)*100); });
  [n(data.ybt_composite_l),n(data.ybt_composite_r)].forEach(v => { if(!isNaN(v)) movScores.push(Math.min((v/95)*100,110)); });
  const movement = movScores.length?Math.round(movScores.reduce((a,b)=>a+b,0)/movScores.length):null;

  return {
    Strength: avg([pctOfBenchmark(data.squat_1rm,"squat_1rm",sex,level),pctOfBenchmark(data.bench_1rm,"bench_1rm",sex,level),pctOfBenchmark(data.clean_1rm,"clean_1rm",sex,level)]),
    Power: avg([pctOfBenchmark(data.broad_jump_fp,"broad_jump_fp",sex,level),pctOfBenchmark(data.vertical,"vertical",sex,level),pctOfBenchmark(data.cmj_height,"cmj_height",sex,level)]),
    "Reactive Str": reactiveStr,
    "Speed/Agility": avg([pctOfBenchmark(data.pro_agility,"pro_agility",sex,level),pctOfBenchmark(data.sprint_10m,"sprint_10m",sex,level)]),
    Aerobic: aerobic,
    Movement: movement,
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// SVG RADAR
// ═══════════════════════════════════════════════════════════════════════════
function buildRadarSVG(scores, size) {
  size = size || 220;
  const labels = Object.keys(scores);
  const values = Object.values(scores);
  const N = labels.length;
  const cx = size/2, cy = size/2, r = size*0.33;
  const hasAny = values.some(v => v !== null);

  if (!hasAny) return '<div style="text-align:center;color:var(--text4);font-size:11px;padding:20px">Enter test data to generate chart</div>';

  const angle = i => (Math.PI*2*i)/N - Math.PI/2;
  const pt = (i, pct) => { const s=Math.min((pct||0),120)/100; return [cx+r*s*Math.cos(angle(i)), cy+r*s*Math.sin(angle(i))]; };

  let rings = '';
  [50,75,100].forEach(pct => {
    const pts = labels.map((_,i) => { const s=pct/100; return [cx+r*s*Math.cos(angle(i)),cy+r*s*Math.sin(angle(i))].join(','); }).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="${pct===100?'#c8a84b':'#3a3a3e'}" stroke-width="${pct===100?1.5:0.8}"/>`;
  });

  let spokes = labels.map((_,i) => { const [x,y]=pt(i,100); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#3a3a3e" stroke-width="0.8"/>`; }).join('');

  const polyPts = labels.map((_,i) => pt(i,values[i]||0).join(',')).join(' ');
  const poly = `<polygon points="${polyPts}" fill="rgba(200,168,75,0.15)" stroke="#c8a84b" stroke-width="1.5"/>`;

  const dots = labels.map((_,i) => {
    if (values[i]===null) return '';
    const [x,y] = pt(i,values[i]);
    return `<circle cx="${x}" cy="${y}" r="3" fill="#c8a84b"/>`;
  }).join('');

  const lbls = labels.map((label,i) => {
    const a = angle(i);
    const lx = cx+(r+30)*Math.cos(a), ly = cy+(r+30)*Math.sin(a);
    const v = values[i];
    const color = v===null?'#555558':v>=100?'#22c55e':v>=75?'#f59e0b':'#ef4444';
    return `<text x="${lx}" y="${ly-4}" text-anchor="middle" font-size="8" fill="#888888" font-family="DM Mono,monospace">${label}</text>
            ${v!==null?`<text x="${lx}" y="${ly+8}" text-anchor="middle" font-size="9" fill="${color}" font-weight="700" font-family="DM Mono,monospace">${v}%</text>`:''}`;
  }).join('');

  return `<svg width="${size}" height="${size}" style="overflow:visible">${rings}${spokes}${poly}${dots}${lbls}
    <text x="${cx}" y="${cy-r-5}" font-size="7" fill="#c8a84b" text-anchor="middle">100%</text></svg>`;
}

// TREND HELPERS
// ═══════════════════════════════════════════════════════════════════════════
const TREND_METRICS = [
  {id:"squat_1rm",label:"Back Squat 1RM",unit:"lbs"},
  {id:"cmj_height",label:"CMJ Height",unit:"in"},
  {id:"rsi_mod",label:"RSI-mod",unit:""},
  {id:"broad_jump_fp",label:"Broad Jump",unit:"in"},
  {id:"pro_agility",label:"Pro Agility",unit:"s"},
  {id:"vo2max",label:"VO2 Max",unit:"ml/kg/min"},
  {id:"eur",label:"EUR",unit:""},
  {id:"lsi_quad",label:"LSI Quad",unit:"%"},
  {id:"lsi_nord",label:"LSI NordBord",unit:"%"},
];

function getTrend(sessions, metric) {
  const vals = sessions.map(s => parseFloat(autoCalc(s.data)[metric])).filter(v => !isNaN(v));
  if (vals.length < 2) return null;
  const first=vals[0], last=vals[vals.length-1], delta=last-first;
  const pct = ((Math.abs(delta)/Math.abs(first))*100).toFixed(1);
  const improving = LOWER_IS_BETTER.has(metric) ? delta<0 : delta>0;
  return {delta,pct,improving,first,last};
}

// ═══════════════════════════════════════════════════════════════════════════
// GROUP RANKING
// ═══════════════════════════════════════════════════════════════════════════
function getGroupRankings(targetClient) {
  if (!targetClient.group) return null;
  const members = clients.filter(c => c.group===targetClient.group && c.sessions?.length>0);
  if (members.length < 2) return null;
  const rankings = [];
  TREND_METRICS.forEach(({id,label,unit}) => {
    const scored = members.map(c => {
      const ld = autoCalc(c.sessions[c.sessions.length-1].data);
      return {name:c.name, id:c.id, val:parseFloat(ld[id])};
    }).filter(x => !isNaN(x.val));
    if (scored.length < 2) return;
    scored.sort((a,b) => LOWER_IS_BETTER.has(id)?a.val-b.val:b.val-a.val);
    const rank = scored.findIndex(x=>x.id===targetClient.id)+1;
    if (rank>0) rankings.push({metric:label,unit,rank,total:scored.length,value:scored.find(x=>x.id===targetClient.id)?.val});
  });
  return rankings.length ? rankings : null;
}

// REPORT ENGINE

function generateReport(client, data) {
  const flags=[], monitors=[], strengths=[], retestPriority=[];

  const push = (arr,metric,value,finding,recommendation,target,ref) => arr.push({metric,value:String(value),finding,recommendation,target,ref});

  // RSI
  const rsi=n(data.rsi_mod);
  if(!isNaN(rsi)){
    if(rsi<1.5){push(flags,"RSI-mod",rsi,"Low reactive strength — unprepared for moderate-intensity plyometrics","Foundational strength first. Submaximal plyometric techniques only: pogo hops, bilateral box steps. Progress when RSI ≥ 1.5.","Target: RSI ≥ 2.0","[6]"); retestPriority.push("RSI-mod (4–6 weeks)");}
    else if(rsi<2.0){push(monitors,"RSI-mod",rsi,"Moderate reactive strength — training opportunity","Moderate-intensity plyometrics appropriate: hurdle hops, broad jumps. Continue building before intensive drop jump loading.","Target: RSI ≥ 2.0","[6]"); retestPriority.push("RSI-mod (6–8 weeks)");}
    else if(rsi<2.5) push(strengths,"RSI-mod",rsi,"Well-established reactive strength — intensive plyometrics appropriate","Maintain 1–2 plyometric sessions/week. Continue pushing toward 2.5.","Keep pushing: RSI 2.5+ is high-level","[6]");
    else push(strengths,"RSI-mod",rsi,rsi>=3.0?"World class reactive strength":"High reactive strength",rsi>=3.0?"Maintain. Redirect emphasis to other limiters.":"Analyze if further RSI gains transfer to performance.","Maintain","[6]");
  }

  // DSI
  const dsi=n(data.dsi);
  if(!isNaN(dsi)){
    if(dsi<0.6){push(flags,"DSI",dsi,"Ballistic dominant — maximal strength is the rate limiter","Phase 1 (4–6 wks): Heavy back squat, trap bar deadlift, hip thrust (3–5 rep range). Limit high-intensity plyometrics until DSI > 0.6.","Target: DSI 0.8–1.0","[7]"); retestPriority.push("DSI (6 weeks — after strength block)");}
    else if(dsi<0.8) push(monitors,"DSI",dsi,"Slight ballistic surplus — concurrent approach recommended","Contrast training: heavy lift paired with explosive movement.","Target: DSI 0.8–1.0","[7]");
    else if(dsi<=1.0) push(strengths,"DSI",dsi,"Well-balanced force-velocity profile","Concurrent strength and power training appropriate.","Maintain: DSI 0.8–1.0 is optimal","[7]");
    else{push(flags,"DSI",dsi,"Strength dominant — explosive quality is the rate limiter","Prioritize plyometric and ballistic training. Reduce max strength volume. Focus on RFD.","Target: DSI 0.8–1.0","[7]"); retestPriority.push("DSI (6 weeks — after power block)");}
  }

  // EUR
  const eur=n(data.eur);
  if(!isNaN(eur)){
    if(eur<0.9) push(monitors,"EUR",parseFloat(eur).toFixed(3),"Below 0.9 — limited SSC/elastic energy utilization","Eccentric loading and SSC work: depth drops, flywheel, loaded CMJ.","Target: EUR ≥ 1.0","[7]");
    else if(eur>=1.15) push(strengths,"EUR",parseFloat(eur).toFixed(3),"Strong elastic energy utilization","Maintain reactive training stimulus.","Maintain EUR > 1.15","[7]");
    else push(strengths,"EUR",parseFloat(eur).toFixed(3),"Adequate EUR — SSC contributing","Continue current SSC training.","Target EUR > 1.15 for elite SSC","[7]");
  }

  // Bilateral Asymmetry
  const asym=Math.abs(n(data.bilateral_asym));
  if(!isNaN(asym)){
    if(asym>15){push(flags,"Bilateral Asymmetry",asym+"%","Significant asymmetry — injury risk elevated","Unilateral loading priority: Bulgarian split squat, SL-RDL, step-ups. Address deficit limb before progressing bilateral loads.","Target: <10%","[6]"); retestPriority.push("Bilateral Asymmetry (4 weeks)");}
    else if(asym>10) push(monitors,"Bilateral Asymmetry",asym+"%","Moderate asymmetry","Unilateral supplemental work 2x/week.","Target: <10%","[6]");
    else push(strengths,"Bilateral Asymmetry",asym+"%","Symmetry within normal limits","Maintain bilateral and unilateral loading balance.","Maintain: <10%","[6]");
  }

  // LSI Quad
  const lsiQ=n(data.lsi_quad);
  if(!isNaN(lsiQ)){
    if(lsiQ<80){push(flags,"LSI — Quad",lsiQ+"%","Significant quad deficit — RTP concern","Phase 1: Isometric quad at 80% MVIC (5×10s, 4–6 wks). Progress to isotonic at LSI >80%, pain-free.","RTP Criterion: LSI ≥ 90%","[6]"); retestPriority.push("LSI Quad (4 weeks)");}
    else if(lsiQ<90){push(monitors,"LSI — Quad",lsiQ+"%","Moderate quad deficit","Isotonic quad progression: open-chain → closed-chain. Target LSI ≥ 90%.","Target: LSI ≥ 90%","[6]"); retestPriority.push("LSI Quad (6 weeks)");}
    else push(strengths,"LSI — Quad",lsiQ+"%","Quad LSI within RTP criteria","Cleared by LSI criterion.","Maintain: LSI ≥ 90%","[6]");
  }

  // LSI NordBord
  const lsiN=n(data.lsi_nord);
  if(!isNaN(lsiN)){
    if(lsiN<80){push(flags,"LSI — Hamstring",lsiN+"%","Significant hamstring deficit — RTP concern","Nordic hamstring protocol 3x/week. Target LSI ≥ 90% before high-speed running.","RTP Criterion: LSI ≥ 90%","[6]"); retestPriority.push("NordBord LSI (4–6 weeks)");}
    else if(lsiN<90) push(monitors,"LSI — Hamstring",lsiN+"%","Moderate hamstring deficit","Nordic + RDL-based loading 2–3x/week.","Target: LSI ≥ 90%","[6]");
    else push(strengths,"LSI — Hamstring",lsiN+"%","Hamstring LSI within criteria","Maintain eccentric hamstring loading.","Maintain: LSI ≥ 90%","[6]");
  }

  // NordBord Asymmetry
  const nordAsym=Math.abs(n(data.nord_asym));
  if(!isNaN(nordAsym)){
    if(nordAsym>15) push(flags,"NordBord Asymmetry",nordAsym+"%","Significant hamstring asymmetry","Unilateral eccentric focus on deficit limb. SL Nordic, SL-RDL.","Target: <10%","[6]");
    else if(nordAsym>10) push(monitors,"NordBord Asymmetry",nordAsym+"%","Moderate hamstring asymmetry","Supplemental unilateral hamstring work.","Target: <10%","[6]");
    else push(strengths,"NordBord Asymmetry",nordAsym+"%","Hamstring symmetry within normal limits","Maintain balanced eccentric loading.","Maintain: <10%","[6]");
  }

  // Strength benchmarks
  [{id:"squat_1rm",label:"Back Squat 1RM",unit:"lbs"},{id:"bench_1rm",label:"Bench Press 1RM",unit:"lbs"},
   {id:"clean_1rm",label:"Power Clean 1RM",unit:"lbs"},{id:"broad_jump_fp",label:"Broad Jump",unit:"in"}
  ].forEach(({id,label,unit}) => {
    const val=n(data[id]),bench=getBenchmark(id,sex,level);
    if(isNaN(val)||!bench) return;
    const pct=Math.round((val/bench)*100);
    if(val<bench) push(monitors,label,`${val}${unit}`,`Below 60th percentile for ${sex} ${level} — ${pct}% of benchmark`,`Progressive overload 3–4x/week.`,`Target: ${bench}${unit} (60th pct)`,"60th Pct Norms");
    else push(strengths,label,`${val}${unit}`,`At or above 60th percentile (${pct}% of benchmark)`,"Maintain with periodized loading.",`Keep improving beyond ${bench}${unit}`,"60th Pct Norms");
  });

  // Pro Agility
  const proAg=n(data.pro_agility),proAgBench=getBenchmark("pro_agility",sex,level);
  if(!isNaN(proAg)&&proAgBench){
    if(proAg>proAgBench) push(monitors,"Pro Agility",proAg+"s",`Below 60th percentile (goal: ≤${proAgBench}s)`,"Reactive COD drills, deceleration mechanics.",`Target: ≤${proAgBench}s`,"60th Pct Norms");
    else push(strengths,"Pro Agility",proAg+"s",`At 60th percentile threshold`,"Maintain sport-specific agility work.",`Keep improving below ${proAgBench}s`,"60th Pct Norms");
  }

  // FMS Composite
  const fmsTotalVal=n(data.fms_total);
  if(!isNaN(fmsTotalVal)){
    if(fmsTotalVal<14){push(flags,"FMS Composite",fmsTotalVal+"/21","Score ≤14 — elevated injury risk","Address deficits in lowest-scoring subtests before progressing training load.","Target: FMS ≥ 14","[1][4]"); retestPriority.push("FMS Composite (8 weeks)");}
    else push(strengths,"FMS Composite",fmsTotalVal+"/21","Score >14 — acceptable movement quality","Continue movement maintenance.","Target: 17+ for elite quality","[1][4]");
  }

  // FMS Individual movements
  const fmsMoves = [
    {ids:["fms_deep_squat"],label:"FMS Deep Squat",r1:"Hip flexor, thoracic, and ankle mobility restrictions. Goblet squat stretch, thoracic mobility, ankle WBLT.",r2:"Mobility work: hip 90/90, deep squat holds.",ref:"[1][4]"},
    {ids:["fms_hurdle_l","fms_hurdle_r"],label:"FMS Hurdle Step",r1:"Hip mobility/stability deficit. Assess hip, ankle, SL stability. Corrective priority before loading.",r2:"Hip mobility drills, hip hinge patterning, ankle ROM.",ref:"[4]"},
    {ids:["fms_lunge_l","fms_lunge_r"],label:"FMS Inline Lunge",r1:"Hip/knee/ankle restriction. Hip flexor stretching, ankle dorsiflexion, SL balance work.",r2:"Hip flexor mobility, step-up progressions.",ref:"[1][4]"},
    {ids:["fms_shoulder_l","fms_shoulder_r"],label:"FMS Shoulder Mobility",r1:"Thoracic restriction, lat tightness, or posterior capsule. Sleeper stretch, lat stretch, thoracic extension.",r2:"Pec minor/lat stretching, shoulder CARs daily.",ref:"[9]"},
    {ids:["fms_aslr_l","fms_aslr_r"],label:"FMS ASLR",r1:"Hamstring/hip stability deficit. Nordic progression, standing hamstring stretch, core stability.",r2:"Daily hamstring flexibility and core stability drills.",ref:"[1]"},
    {ids:["fms_tspu"],label:"FMS Trunk Stability PU",r1:"Trunk stability deficit. Plank progressions, dead bug, RNT push-up. Do not load overhead until resolved.",r2:"Plank, hollow body, ab wheel.",ref:"[9]"},
    {ids:["fms_rs_l","fms_rs_r"],label:"FMS Rotary Stability",r1:"Rotary stability deficit. Bird-dog progressions, anti-rotation press, core coordination.",r2:"Bird-dog, pallof press, half-kneeling rotational work.",ref:"[1]"},
  ];
  fmsMoves.forEach(({ids,label,r1,r2,ref}) => {

    if(!vals.length) return;

  // YBT

    if(v<90){push(flags,`YBT Composite ${side}`,v+"%","Score <90% — 3.5x greater injury risk","SL balance and stability: hip strengthening, dynamic balance progressions, perturbation training.","Target: ≥95%","[2][5]"); retestPriority.push(`YBT Composite ${side} (6 weeks)`);}
    else if(v<95) push(monitors,`YBT Composite ${side}`,v+"%","Score 90–94% — approaching risk threshold","Dynamic balance training 2x/week.","Target: ≥95%","[2][5]");

  if(!isNaN(bj90)){

    if(bj90<bjB) push(monitors,"90-Second Box Jump",bj90+" reps",`Below benchmark (goal: ≥${bjB} reps)`,"Anaerobic power-endurance: box jump progressions, jump circuits.",`Target: ≥${bjB} reps`,"Anaerobic Norms");

  if(!isNaN(mas)){

    if(mas<masB) push(monitors,"MAS",mas+" km/h",`Below benchmark (goal: ≥${masB} km/h)`,"MAS-based intervals: 15/15s and 30/30s at 100–110% MAS.",`Target: ≥${masB} km/h`,"MAS Norms");

    else push(strengths,"VO2 Max",vo2+" ml/kg/min",`At or above 60th percentile — ${pct}% of benchmark`,"Maintain aerobic base.","Keep pushing","60th Pct Norms");
  }

  // Body Fat
  const bf=n(data.body_fat);
  if(!isNaN(bf)){
    const hi=sex==="Male"?15:25, lo=sex==="Male"?6:14;
    if(bf>hi) push(monitors,"Body Fat %",bf+"%",`Above performance-optimal range (>${hi}%)`,"Moderate caloric deficit with resistance training.",`Target: ${lo}–${hi}%`,"Body Comp Standards");
    else if(bf<lo) push(flags,"Body Fat %",bf+"%",`Below healthy minimum (<${lo}%) — RED-S risk`,"Increase caloric intake. Consult sports dietitian.",`Target: ${lo}–${hi}%`,"Body Comp Standards");
    else push(strengths,"Body Fat %",bf+"%","Body composition within performance-optimal range","Maintain.","Maintain current range","Body Comp Standards");
  }

  const radarScores = getRadarScores(data, sex, level);
  const rankData = getGroupRankings(client);
  const trends = TREND_METRICS.map(m => ({...m, trend:getTrend(client.sessions||[],m.id)})).filter(m=>m.trend);

  // Summary
  const validRadar = Object.entries(radarScores).filter(([,v])=>v!==null).sort((a,b)=>b[1]-a[1]);
  let summary = null;
  if(flags.length+monitors.length+strengths.length>0){
    summary = `${client.name} — ${strengths.length} metric${strengths.length!==1?"s":""} at or above benchmark`;
    if(flags.length>0) summary += `, ${flags.length} clinical flag${flags.length!==1?"s":""}`;
    if(monitors.length>0) summary += `, ${monitors.length} area${monitors.length!==1?"s":""} to monitor`;
    summary += ".";
    if(validRadar.length>0) summary += ` Strongest domain: ${validRadar[0][0]} (${validRadar[0][1]}%).`;
    if(validRadar.length>1) summary += ` Primary limiter: ${validRadar[validRadar.length-1][0]} (${validRadar[validRadar.length-1][1]}%).`;
    if(flags[0]) summary += ` Top priority: ${flags[0].metric}.`;
  }

  return {flags,monitors,strengths,retestPriority,radarScores,rankData,trends,summary,hasData:flags.length+monitors.length+strengths.length>0};
}

let activeGroupFilter = 'All';

function renderClientList() {
  // Group filter
  const groups = ['All', ...new Set(clients.map(c=>c.group).filter(Boolean))];
  const gWrap = document.getElementById('group-filter-wrap');
  if (groups.length > 1) {
    gWrap.style.display = 'flex';
    gWrap.innerHTML = groups.map(g =>
      `<button class="group-btn${g===activeGroupFilter?' active':''}" onclick="setGroupFilter('${g}')">${g}</button>`
    ).join('');
  } else { gWrap.style.display = 'none'; }

  const filtered = activeGroupFilter === 'All' ? clients : clients.filter(c=>c.group===activeGroupFilter);
  const el = document.getElementById('clients-list');

  if (!filtered.length) {
    el.innerHTML = '<div class="empty">No clients yet.<br>Tap + to add your first athlete.</div>';
    return;
  }

  el.innerHTML = filtered.map(c => {
    const ld = c.sessions?.length ? autoCalc(c.sessions[c.sessions.length-1].data) : {};
    const rs = c.sessions?.length ? getRadarScores(ld, c.sex, c.level) : {};
    const vals = Object.values(rs).filter(v=>v!==null);
    const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    const rsi = ld.rsi_mod ? parseFloat(ld.rsi_mod) : null;
    const rsiColor = rsi===null?'var(--text4)':rsi<1.5?'var(--red)':rsi<2.0?'var(--yellow)':'var(--green)';

    return `<div class="client-card" onclick="openProfile('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="client-name">${c.name}</div>
          <div class="client-meta">${c.sport} · ${c.level} · ${c.sex}${c.position?' · '+c.position:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${c.group?`<span class="client-badge">${c.group}</span>`:''}
          ${avg!==null?`<span style="font-size:12px;font-weight:700;color:${avg>=100?'var(--green)':avg>=75?'var(--yellow)':'var(--red)'}">${avg}% avg</span>`:''}
          ${rsi!==null?`<span style="font-size:10px;color:${rsiColor}">RSI ${rsi}</span>`:''}
        </div>
      </div>

        ${c.sessions?.length?`${c.sessions.length} session${c.sessions.length>1?'s':''} · Last: ${new Date(c.sessions[c.sessions.length-1].date).toLocaleDateString()}`:'No sessions yet'}
      </div>
    </div>`;
  }).join('');
}

function setGroupFilter(g) {
  activeGroupFilter = g;
  renderClientList();
}

function openProfile(id) {
  activeClient = clients.find(c => c.id === id);
  if (!activeClient) return;
  renderProfile();
  showPage('profile', null);
}

function renderProfile() {
  const c = activeClient;
  const ld = c.sessions?.length ? autoCalc(c.sessions[c.sessions.length-1].data) : {};
  const rs = c.sessions?.length ? getRadarScores(ld, c.sex, c.level) : {};
  const vals = Object.values(rs).filter(v=>v!==null);
  const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : null;

  // Hero
  document.getElementById('profile-hero').innerHTML = `
    <div class="hero-card">
      <div class="hero-name">${c.name}</div>
      <div class="hero-sub">${c.sport}${c.position?' · '+c.position:''} · ${c.level}</div>
      <div class="hero-meta">${c.sex}${c.age?' · Age '+c.age:''}${c.group?' · '+c.group:''}</div>
      ${avg!==null?`<div class="hero-avg"><span class="hero-avg-label">Benchmark Average</span><span class="hero-avg-val" style="color:${avg>=100?'var(--green)':avg>=75?'var(--yellow)':'var(--red)'}">${avg}%</span></div>`:''}
    </div>`;

  renderOverview(c, ld);
  renderRadar(c, rs, avg);
  renderTrends(c);

  // Battery
  const battery = SPORT_BATTERIES[c.sport] || SPORT_BATTERIES['General Athletic'];
  document.getElementById('battery-profile-wrap').innerHTML = `
    <button class="battery-toggle" onclick="toggleBattery('profile')">Testing Battery ▼</button>
    <div class="battery-content" id="battery-profile">
      <div style="font-size:10px;color:var(--text4);margin-bottom:9px">${battery.note}</div>
      ${battery.cats.map(cat=>`<div class="battery-cat"><div class="battery-cat-name">${cat.cat}</div><div class="battery-tests">${cat.tests.map(t=>`<span class="battery-test">${t}</span>`).join('')}</div></div>`).join('')}
    </div>`;

  // Session history
  renderSessionHistory(c);
}

function mRow(label, value, unit, badgeHtml) {
  return `<div class="metric-row">
    <span class="metric-label">${label}</span>
    <span style="display:flex;align-items:center;gap:6px">
      <span class="metric-value">${value}<span class="metric-unit">${unit||''}</span></span>
      ${badgeHtml||''}
    </span>
  </div>`;
}

function badge(color, label) {
  return `<span class="badge badge-${color}">${label}</span>`;
}

function lsiBadge(v) {
  const r = parseFloat(v); if(isNaN(r)) return '';
  return badge(r>=90?'green':r>=80?'yellow':'red', r>=90?'Cleared':r>=80?'Monitor':'Deficit');
}

function asymBadge(v) {
  const r = Math.abs(parseFloat(v)); if(isNaN(r)) return '';
  return badge(r<=10?'green':r<=15?'yellow':'red', r<=10?'Symmetric':r<=15?'Moderate':'Asymmetric');
}

function benchBadge(val, metric, sex, level, lowerBetter) {
  const b = getBenchmark(metric, sex, level);
  if (!b || isNaN(parseFloat(val))) return '';
  const pct = lowerBetter ? Math.round(b/parseFloat(val)*100) : Math.round(parseFloat(val)/b*100);
  return badge(pct>=100?'green':'yellow', pct+'% bench');
}

function fmsBadge(v) {
  const r=parseFloat(v); if(isNaN(r)) return '';
  return badge(r===3?'green':r===2?'yellow':'red', r===3?'3 — Functional':r===2?'2 — Compensatory':r===1?'1 — Dysfunctional':'0 — Pain');
}

    if(ld.dsi) { const d=parseFloat(ld.dsi); html += mRow('DSI', ld.dsi, '', badge(d>=0.8&&d<=1.0?'green':d<0.6?'blue':'red', d>=0.8&&d<=1.0?'Balanced':d<0.6?'Ballistic Dom':'Strength Dom')); }

    if(ld.bench_1rm) html += mRow('Bench Press 1RM', ld.bench_1rm, 'lbs', benchBadge(ld.bench_1rm,'bench_1rm',c.sex,c.level));

    ];
    fmsFields.forEach(({ids,label}) => {
      const vals = ids.map(id=>ld[id]).filter(Boolean);
      if(!vals.length) return;
      if(ids.length===1) {
        html += mRow(label, vals[0], '/3', fmsBadge(vals[0]));
      } else {
        const l=ld[ids[0]], r=ld[ids[1]];

        const rColor = r?(parseFloat(r)===3?'var(--green)':parseFloat(r)===2?'var(--yellow)':'var(--red)'):'var(--text4)';

    if(ld.sl_squat_l) html += mRow('SL Squat Left', ld.sl_squat_l, '/3', fmsBadge(ld.sl_squat_l));
    if(ld.sl_squat_r) html += mRow('SL Squat Right', ld.sl_squat_r, '/3', fmsBadge(ld.sl_squat_r));

    html += `<div class="radar-domain-row">

function renderTrends(c) {
  const el = document.getElementById('profile-trends');
  let html = '<div class="sh">Progress Trends</div>';

  if (!c.sessions || c.sessions.length < 2) {
    html += '<div style="color:var(--text4);font-size:12px;padding:20px 0;text-align:center">Need at least 2 sessions to show trends</div>';
    el.innerHTML = html; return;
  }

  TREND_METRICS.forEach(({id,label,unit}) => {
    const t = getTrend(c.sessions, id);
    if (!t) return;
    const color = t.improving ? 'var(--green)' : 'var(--red)';
    html += `<div class="trend-row">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="trend-label">${label}</span>
        <span class="trend-pct" style="color:${color}">${t.improving?'↑':'↓'} ${Math.abs(t.pct)}%</span>
      </div>
      <div class="trend-detail">${t.first}${unit} → ${t.last}${unit} · ${c.sessions.length} sessions</div>
    </div>`;
  });

  el.innerHTML = html;
}

function renderSessionHistory(c) {
  const el = document.getElementById('session-history');
  if (!c.sessions?.length) { el.innerHTML = ''; return; }
  let html = '<div class="sh">Session History</div>';
  [...c.sessions].reverse().forEach((sess,i) => {
    const count = Object.keys(sess.data).filter(k=>sess.data[k]).length;
    html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:9px 13px;margin-bottom:6px;font-size:11px;color:var(--text4)">
      ${new Date(sess.date).toLocaleDateString()} · ${count} metrics recorded
    </div>`;
  });
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// TEST SESSION ENTRY
// ═══════════════════════════════════════════════════════════════════════════
function startTestEntry() {
  if (!activeClient) return;
  sessionData = {};
  document.getElementById('session-header').textContent = activeClient.name + ' · ' + activeClient.sport + ' · ' + new Date().toLocaleDateString() + ' · EUR, LSI, and Asymmetry are auto-calculated';
  renderTestFields();
  // Navigate to the page directly without triggering the override
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-test-entry').classList.add('active');
  document.getElementById('fab').classList.remove('visible');
  window.scrollTo(0, 0);
}

// Override showPage for test-entry to call startTestEntry
const _origShowPage = showPage;
window.showPageOrig = _origShowPage;

function renderTestFields() {
  let html = '';
  METRIC_CATEGORIES.forEach(cat => {
    html += `<div class="sh">${cat.label}</div>`;
    cat.fields.forEach(f => {
      html += `<div class="field">
        <label>${f.label}${f.unit?' ('+f.unit+')':''}${f.note?`<span class="auto-tag">${f.note}</span>`:''}
        </label>
        <input type="text" inputmode="decimal" id="tf-${f.id}" placeholder="${f.unit||'—'}"
          value="${sessionData[f.id]||''}"
          oninput="sessionData['${f.id}']=this.value"/>
      </div>`;
    });
  });
  document.getElementById('test-fields').innerHTML = html;
}

async function saveSession() {
  if (!activeClient) return;
  const computed = autoCalc(sessionData);
  const session = { date: new Date().toISOString(), data: computed };
  activeClient.sessions = [...(activeClient.sessions||[]), session];

  // Update in clients array
  const idx = clients.findIndex(c => c.id === activeClient.id);
  if (idx >= 0) clients[idx] = activeClient;

  await persistClients();
  showToast('Session saved');
  renderProfile();
  showPage('profile', null);
}

// ═══════════════════════════════════════════════════════════════════════════
// REPORT
// ═══════════════════════════════════════════════════════════════════════════
function openReport() {
  if (!activeClient || !activeClient.sessions?.length) { showToast('No sessions yet', true); return; }
  const ld = autoCalc(activeClient.sessions[activeClient.sessions.length-1].data);
  const report = generateReport(activeClient, ld);
  renderReport(report);

  // Switch to report page
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-report-page').classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab')[1].classList.add('active');
  document.getElementById('fab').classList.remove('visible');
  window.scrollTo(0,0);
}

function renderReport(report) {
  const c = activeClient;
  document.getElementById('report-empty').style.display = 'none';
  const el = document.getElementById('report-content');
  el.style.display = 'block';

  let html = '';

  // Header
  html += `<div class="hero-card">
    <div style="font-size:13px;font-weight:700;color:var(--text)">${c.name} · ${c.sport} · ${c.level}</div>
    <div style="font-size:10px;color:var(--text4);margin-top:2px">${new Date().toLocaleDateString()} · ${report.flags.length} flags · ${report.monitors.length} monitors · ${report.strengths.length} strengths</div>
    ${report.summary?`<div style="font-size:12px;color:var(--text2);margin-top:9px;line-height:1.6">${report.summary}</div>`:''}
  </div>`;

  // Radar
  if (Object.values(report.radarScores).some(v=>v!==null)) {
    html += `<div class="sh">PERFORMANCE PROFILE</div>
    <div class="radar-wrap">${buildRadarSVG(report.radarScores,200)}</div>`;
  }

  // Rankings
  if (report.rankData) {
    html += `<div class="sh">GROUP RANKINGS — ${c.group}</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px;margin-bottom:14px">`;
    report.rankData.forEach((r,i) => {
      const color = r.rank===1?'var(--green)':r.rank<=Math.ceil(r.total/2)?'var(--yellow)':'var(--red)';
      html += `<div class="rank-row">
        <span class="rank-metric">${r.metric}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="rank-val">${r.value}${r.unit}</span>
          <span class="rank-badge" style="color:${color}">#${r.rank}/${r.total}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  // Trends
  if (report.trends.length) {
    html += `<div class="sh">PROGRESS SINCE FIRST SESSION</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px;margin-bottom:14px">`;
    report.trends.forEach((m,i) => {
      const color = m.trend.improving?'var(--green)':'var(--red)';
      html += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:${i<report.trends.length-1?'1px solid var(--bg)':'none'}">
        <span style="font-size:11px;color:var(--text4)">${m.label}</span>
        <span style="font-size:11px;font-weight:700;color:${color}">${m.trend.improving?'↑':'↓'} ${Math.abs(m.trend.pct)}% (${m.trend.first}${m.unit} → ${m.trend.last}${m.unit})</span>
      </div>`;
    });
    html += '</div>';
  }

  // Report card helper
  const rcCard = (item, borderColor) => `
    <div class="report-card" style="border:1px solid ${borderColor}33;border-left:3px solid ${borderColor}">
      <div class="report-card-header">
        <span class="report-metric">${item.metric}</span>
        <span class="report-value" style="background:${borderColor}22;color:${borderColor}">${item.value}</span>
      </div>
      <div class="report-finding">${item.finding}</div>
      <div class="report-rec">${item.recommendation}</div>
      ${item.target?`<div class="report-target" style="color:${borderColor}bb">${item.target}</div>`:''}
      <div class="report-ref">Ref: ${item.ref}</div>
    </div>`;

  if (report.flags.length) {
    html += `<div class="sh" style="color:var(--red)">CLINICAL FLAGS (${report.flags.length})</div>`;
    report.flags.forEach(f => html += rcCard(f, '#ef4444'));
  }
  if (report.monitors.length) {
    html += `<div class="sh" style="color:var(--yellow)">MONITOR (${report.monitors.length})</div>`;
    report.monitors.forEach(m => html += rcCard(m, '#f59e0b'));
  }
  if (report.strengths.length) {
    html += `<div class="sh" style="color:var(--green)">STRENGTHS (${report.strengths.length})</div>`;
    report.strengths.forEach(s => html += rcCard(s, '#22c55e'));
  }

  if (report.retestPriority.length) {
    html += `<div class="sh">RETEST PRIORITY</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px;margin-bottom:14px">
      ${report.retestPriority.map(r=>`<div style="font-size:11px;color:var(--text3);padding:4px 0;border-bottom:1px solid var(--bg)">· ${r}</div>`).join('')}
    </div>`;
  }

  // References
  html += `<div class="ref-list">
    <div class="ref-title">REFERENCES</div>
    ${[
      "[1] Chang & Lu (2020). Sport-Specific Functional Tests & Injury Risk. J Healthcare Eng. PMID:33490258",
      "[2] Huang et al. (2023). YBT-LQ composite score as injury predictor. Front Physiol. PMC10319993",
      "[3] Viviane et al. (2023). SL squat for LE injury prediction in adolescents. Med Clin Res 8(6)",
      "[4] Lin & Guan (2024). FMS Injury Prediction Racket Sports. Int J Sports Exerc Med 10:270",
      "[5] Plisky et al. SEBT anterior asymmetry >4cm & composite <94% predict LE injury",
      "[6] RSI Performance Thresholds — Jump Height Method standards",
      "[7] Comfort et al. (2018) / Townsend et al. (2019). Dynamic Strength Index framework",
      "[8] Tourillon et al. (2025). Ankle dorsiflexion ROM & injury risk. PMC12585996",
    ].map(r=>`<div class="ref-item">${r}</div>`).join('')}
  </div>`;

  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════════
function showToast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError?' error':'');
  setTimeout(() => el.className = 'toast', 3000);
}

// ═══════════════════════════════════════════════════════════════════════════
// OVERRIDE showPage to handle test-entry properly
// ═══════════════════════════════════════════════════════════════════════════
window.showPage = function(id, btn) {
  if (id === 'test-entry') { startTestEntry(); return; }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('fab').classList.toggle('visible', id === 'clients');
  window.scrollTo(0, 0);
};

);

);
document.getElementById('page-test-entry').insertAdjacentHTML('afterbegin',

);
document.getElementById('page-report-page').insertAdjacentHTML('afterbegin',
  '<button onclick="showPage(\'profile\',null)" style="background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;font-family:\'DM Mono\',monospace;margin-bottom:14px;padding:0">← Profile</button>'
);

window.addEventListener('load', async () => {
  updateBatteryPreview();

  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) loginSuccess(session.user);

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('app').classList.remove('visible');
      document.getElementById('fab').classList.remove('visible');
    }
  });
});
